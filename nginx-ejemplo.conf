# Solo referencia: integrar en el virtual host HTTPS que administra el desarrollador.
# Certificado y listen TLS a cargo de su configuración existente.
# No reemplazar la configuración global ni la plataforma web.
location / {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 60m;
    client_body_timeout 180s;
    proxy_connect_timeout 30s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;
    proxy_request_buffering off;
}
