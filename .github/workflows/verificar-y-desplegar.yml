name: Verificar y desplegar videos
on:
  push:
    branches: [produccion]
  pull_request:
    branches: [produccion]
  workflow_dispatch:
    inputs:
      desplegar:
        description: 'Desplegar el servicio de videos configurado'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: chronoathlos-videos-produccion
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t chronoathlos-videos:verificacion .
  desplegar:
    needs: verificar
    if: github.event_name == 'workflow_dispatch' && inputs.desplegar && github.ref == 'refs/heads/produccion'
    runs-on: ubuntu-latest
    environment: produccion
    steps:
      - name: Activar despliegue exclusivo del servicio
        env:
          DEPLOY_URL: ${{ secrets.VIDEOS_DEPLOY_URL }}
          SALUD_URL: https://videos.chronoathlos.com.py/salud
        run: |
          python - <<'PY'
          import os, time, urllib.request
          url = os.environ.get('DEPLOY_URL', '')
          if not url.startswith('https://'):
              raise SystemExit('Configurar VIDEOS_DEPLOY_URL HTTPS en el entorno produccion')
          try:
              with urllib.request.urlopen(urllib.request.Request(url, method='POST'), timeout=180) as r:
                  if not 200 <= r.status < 300: raise RuntimeError()
          except Exception:
              raise SystemExit('El despliegue no fue aceptado; revisar el servicio sin publicar la URL secreta')
          print('Despliegue solicitado. Verificar en el panel que termino y corresponde al commit elegido.')
          # La salud confirma disponibilidad, no la version desplegada.
          time.sleep(10)
          try:
              with urllib.request.urlopen(os.environ['SALUD_URL'], timeout=30) as r:
                  if r.status != 200: raise RuntimeError()
          except Exception:
              raise SystemExit('Servicio sin respuesta de salud; revisar despliegue')
          print('Salud HTTPS accesible; falta confirmar version y prueba de subida.')
          PY
