name: Verificar el servicio de videos
on:
  push:
    branches: [produccion]
  pull_request:
    branches: [produccion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: chronoathlos-videos-verificar-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: docker build -t chronoathlos-videos:verificacion .
      # Verificar no despliega nada: la actualizacion del servidor del cliente
      # se pide a mano con «Desplegar Docker por SSH limitado».
